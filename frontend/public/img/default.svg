<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="智选商城">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe5"/>
      <stop offset="1" stop-color="#e5dccb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#4a3c2a" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="640" cy="190" r="230" fill="#ffffff" opacity=".42"/>
  <text x="64" y="96" font-family="Inter, sans-serif" font-size="20" letter-spacing="9" fill="#8b8171">SMART GUIDE MALL</text>
  <g filter="url(#shadow)">
    <rect x="250" y="330" width="300" height="340" rx="24" fill="#1b1a17"/>
    <rect x="264" y="344" width="272" height="312" rx="16" fill="#f7f2e8" opacity=".1"/>
    <text x="400" y="530" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="120" fill="#f7f2e8">智</text>
    <circle cx="540" cy="650" r="26" fill="#f05a28" stroke="#f4efe5" stroke-width="6"/>
  </g>
  <g font-family="Inter, sans-serif">
    <text x="64" y="900" font-family="'Noto Serif SC','Songti SC',serif" font-size="46" fill="#221f1a" letter-spacing="4">智选商城</text>
    <text x="64" y="944" font-size="18" letter-spacing="7" fill="#8b8171">SMART GUIDE MALL</text>
  </g>
</svg>
