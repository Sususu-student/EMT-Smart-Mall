spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smartmall_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

app:
  seed:
    enabled: true
  order:
    unpaid-timeout-minutes: 30

llm:
  enabled: true

logging:
  level:
    root: WARN
    com.smartmall: INFO
