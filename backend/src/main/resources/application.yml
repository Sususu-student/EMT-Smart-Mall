server:
  # 允许平台通过 PORT 环境变量注入（Render/Railway/Heroku 等）
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: smart-guide-mall
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  # 上传文件落盘目录（相对后端运行目录），通过 /uploads/** 访问
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-size: 5242880
  jwt:
    secret: ${JWT_SECRET:smart-guide-mall-demo-secret-key-please-change-in-production-2026}
    expire-hours: 72
  cors:
    # 本地开发默认放行 Vite；线上部署可用 CORS_ORIGINS 覆盖（逗号分隔）
    # 已放行：Pages 默认域名 + 自定义根域名（含 www）
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://emt-smart-mall.pages.dev,https://20838639.xyz,https://www.20838639.xyz}
  seed:
    enabled: true
  order:
    unpaid-timeout-minutes: 30

llm:
  # 留空则自动降级为规则引擎，项目在无 API Key 时仍可完整演示
  # 安全约定：不要把真实 Key 写进本文件，请用环境变量 DEEPSEEK_API_KEY 注入
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-v4.1-flash}
  # 快速模型：用于意图识别、槽位提取等短输出任务；留空表示复用主模型
  fast-model: ${DEEPSEEK_FAST_MODEL:}
  temperature: 0.3
  timeout-seconds: 30
  # 输出 token 上限：限制推理模型的无界输出，显著降低延迟
  short-task-max-tokens: 512
  gen-task-max-tokens: 1600
  enabled: true
  max-consecutive-failures: 3
  cooldown-seconds: 60

logging:
  level:
    root: INFO
    com.smartmall: INFO
    com.smartmall.mapper: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/smartmall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smart_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
